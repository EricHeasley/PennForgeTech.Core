name: CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore PennForgeTech.Core.sln
      - run: dotnet build PennForgeTech.Core.sln --no-restore --configuration Release
      - run: dotnet test PennForgeTech.Core.sln --no-build --configuration Release
